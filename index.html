<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TonizLab 3D — Asistente de Contenido</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
      background: #0f1115;
      color: #e8e8ec;
    }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    p.subtitle { color: #9a9aa5; margin-top: 0; margin-bottom: 24px; }
    label { display: block; margin-top: 16px; margin-bottom: 6px; font-size: 0.9rem; color: #c4c4cc; }
    input[type="text"] {
      width: 100%; padding: 10px 12px; border-radius: 8px;
      border: 1px solid #2a2d36; background: #1a1d24; color: #e8e8ec; font-size: 0.95rem;
    }
    input[type="file"] {
      width: 100%; padding: 10px 0; color: #c4c4cc;
    }
    #preview {
      margin-top: 10px; max-width: 100%; max-height: 220px;
      border-radius: 8px; display: none; border: 1px solid #2a2d36;
    }
    button {
      margin-top: 24px; width: 100%; padding: 13px; border: none;
      border-radius: 8px; background: #4f7cff; color: white; font-size: 1rem;
      font-weight: 600; cursor: pointer;
    }
    button:disabled { background: #3a3d46; cursor: not-allowed; }
    #status { margin-top: 14px; font-size: 0.9rem; color: #9a9aa5; min-height: 20px; }
    .result-block {
      display: none; margin-top: 30px; padding: 18px; background: #1a1d24;
      border-radius: 10px; border: 1px solid #2a2d36;
    }
    .result-block h3 { margin-top: 0; font-size: 1rem; color: #c4c4cc; }
    .result-block pre {
      white-space: pre-wrap; word-wrap: break-word; font-family: inherit;
      font-size: 0.92rem; line-height: 1.5; margin: 0;
    }
    .copy-btn {
      margin-top: 10px; width: auto; padding: 6px 12px; font-size: 0.8rem;
      background: #2a2d36;
    }
    .variant-item {
      background: #14161c; border: 1px solid #2a2d36; border-radius: 8px;
      padding: 12px 14px; margin-bottom: 10px;
    }
    .variant-item .variant-label {
      font-size: 0.75rem; color: #6b8cff; font-weight: 600; margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: 0.03em;
    }
    .variant-item pre {
      white-space: pre-wrap; word-wrap: break-word; font-family: inherit;
      font-size: 0.92rem; line-height: 1.5; margin: 0;
    }
    .variant-item .copy-btn { margin-top: 8px; }
    .error { color: #ff6b6b; }
  </style>
</head>
<body>
  <h1>TonizLab 3D 🖨️</h1>
  <p class="subtitle">Sube una foto real de tu pieza impresa para generar copys, guiones y contenido.</p>

  <form id="generatorForm">
    <label for="productName">Nombre del producto</label>
    <input type="text" id="productName" name="productName" placeholder="Ej: Organizador Modular Escritorio" required />

    <label for="mainBenefit">Beneficio principal</label>
    <input type="text" id="mainBenefit" name="mainBenefit" placeholder="Ej: Organiza tu espacio sin perder estilo" required />

    <label for="printTime">Tiempo de impresión (Opcional)</label>
    <input type="text" id="printTime" name="printTime" placeholder="Ej: 4 horas y 30 minutos" />

    <label for="filamentType">Tipo de filamento (Opcional)</label>
    <input type="text" id="filamentType" name="filamentType" placeholder="Ej: PLA+ Matte Negro" />



    <button type="submit" id="submitBtn">Analizar pieza y generar contenido</button>
    <div id="status"></div>
  </form>

  <div class="result-block" id="copyResult">
    <h3>📸 Instagram (3 Opciones)</h3>
    <div id="igVariants"></div>

    <h3 style="margin-top:22px;">🎬 TikTok (3 Opciones)</h3>
    <div id="ttVariants"></div>

    <h3 style="margin-top:22px;">🎠 Carruseles Educativos (3 Opciones)</h3>
    <div id="carouselVariants"></div>

    <h3 style="margin-top:22px;">📱 Historias: Detrás de escenas (3 Opciones)</h3>
    <div id="storiesVariants"></div>

    <h3 style="margin-top:22px;">🏷️ Hashtags</h3>
    <pre id="hashtags"></pre>
    <button class="copy-btn" data-target="hashtags">Copiar</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
